site_name: DualSense Client
site_description: >-
  Unofficial DualSense client for Windows and Linux. Customize and monitor your
  PS5 DualSense controller: lighting, profiles, input monitoring, rumble,
  adaptive triggers, and audio to the controller's speaker and haptics.
site_url: https://dualsenseclient.github.io/DualSenseClient/
repo_url: https://github.com/DualSenseClient/DualSenseClient
repo_name: DualSenseClient/DualSenseClient
edit_uri: edit/main/docs/

copyright: >
  GPL-3.0 licensed. Not affiliated with or endorsed by Sony Interactive Entertainment.

exclude_docs: |
  CONTRIBUTING.md

theme:
  name: material
  logo: assets/images/icon.png
  favicon: assets/images/favicon.ico
  palette:
    - scheme: slate
      primary: blue
      accent: light blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Guides:
      - Device Information: guides/device-info.md
      - Input Monitor: guides/input-monitor.md
      - Rumble & Triggers: guides/rumble-and-triggers.md
      - Audio Playback: guides/audio.md
      - Light Control: guides/light-control.md
      - Profiles: guides/profiles.md
      - Special Actions: guides/special-actions.md
      - Virtual Controller: guides/virtual-controller.md
      - Controller Hiding: guides/controller-hiding.md
      - Settings: guides/settings.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md

