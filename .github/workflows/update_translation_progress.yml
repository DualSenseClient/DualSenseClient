name: Update Translation Progress

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

# Chart rebuilds the full file; last write wins.
concurrency:
  group: translation-progress-data
  cancel-in-progress: false

jobs:
  update_translation_progress:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate translation chart
        run: python ./scripts/generate_translation_progress.py --chart

      - name: Publish to data branch
        shell: pwsh
        run: |
          Copy-Item assets/translation-progress.png $env:RUNNER_TEMP/translation-progress.png -Force
          git fetch origin data:data 2>$null
          git show-ref --verify --quiet refs/heads/data
          if ($LASTEXITCODE -eq 0) {
            git checkout data
          } else {
            git checkout --orphan data
            git rm -rf . 2>$null
          }
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item $env:RUNNER_TEMP/translation-progress.png assets/translation-progress.png -Force
          git add assets/translation-progress.png
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "data: Update translation progress chart"
          if ($LASTEXITCODE -ne 0) { echo "No changes" }
          git push origin data
