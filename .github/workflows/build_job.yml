name: Build
on:
  workflow_call:
    inputs:
      is_stable:
        type: boolean
        required: true
        default: false
      is_experimental:
        type: boolean
        required: false
        default: false
    outputs:
      sha_short:
        value: ${{ jobs.build_windows.outputs.sha_short }}
      branch:
        value: ${{ jobs.build_windows.outputs.branch }}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DualSenseClient.sln

      - name: Fetch native libraries
        run: python scripts/fetch_native_libraries.py win-x64

      - name: Test
        run: dotnet test tests/DualSenseClient.Tests/DualSenseClient.Tests.csproj

  build_windows:
    runs-on: windows-latest
    needs: test
    outputs:
      sha_short: ${{ steps.info.outputs.sha_short }}
      branch: ${{ steps.info.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DualSenseClient.sln

      - name: Fetch native libraries
        run: python scripts/fetch_native_libraries.py win-x64

      - name: Get build info
        id: info
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          $shortSha = $sha.Substring(0, 9)
          $branch = "${{ github.ref_name }}"

          "sha_short=$shortSha" >> $env:GITHUB_OUTPUT
          "branch=$branch" >> $env:GITHUB_OUTPUT

      - name: Publish the app
        shell: pwsh
        run: >
          dotnet publish -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:NightlyBuild=${{ inputs.is_experimental }}
          -o publish/desktop
          source/DualSenseClient.GUI/DualSenseClient.GUI.csproj

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DualSenseClient
          path: publish/desktop/DualSenseClient.exe

  build_linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Fetch native libraries
        run: python scripts/fetch_native_libraries.py linux-x64

      - name: Publish the app
        run: >
          dotnet publish -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:NightlyBuild=${{ inputs.is_experimental }}
          -o publish/desktop
          source/DualSenseClient.GUI/DualSenseClient.GUI.csproj

      - name: Create AppImage
        shell: bash
        run: |
          set -e

          curl -sL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

          mkdir -p AppDir/usr/bin
          cp publish/desktop/DualSenseClient AppDir/usr/bin/DualSenseClient
          chmod +x AppDir/usr/bin/DualSenseClient
          cp source/DualSenseClient.GUI/Assets/icon.png AppDir/dualsenseclient.png

          cat > AppDir/DualSenseClient.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DualSenseClient
          Comment=DualSense controller client
          Exec=DualSenseClient
          Icon=dualsenseclient
          Categories=Utility;Game;
          Terminal=false
          EOF

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          exec "$APPDIR/usr/bin/DualSenseClient" "$@"
          EOF
          chmod +x AppDir/AppRun

          ./appimagetool --appimage-extract-and-run AppDir DualSenseClient.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: DualSenseClient-linux
          path: publish/desktop/DualSenseClient

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: DualSenseClient-linux-appimage
          path: DualSenseClient.AppImage
