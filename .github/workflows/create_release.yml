name: Create release
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      is_stable:
        required: true
        type: boolean

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $props = Get-Content -Path "Directory.Build.props" -Raw
          $match = [regex]::Match($props, '<Version>([^<]+)</Version>')
          if (-not $match.Success) {
            Write-Error "Version not found in Directory.Build.props"
            exit 1
          }
          $version = $match.Groups[1].Value.Trim()
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: "DualSenseClient"
          path: ./publish/desktop

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: "DualSenseClient-linux"
          path: ./publish/desktop-linux

      - name: Download AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: "DualSenseClient-linux-appimage"
          path: ./publish/appimage

      - name: Create ZIP archives
        run: |
          Compress-Archive -Path .\publish\desktop\* -DestinationPath .\DualSenseClient.zip
          Compress-Archive -Path .\publish\desktop-linux\* -DestinationPath .\DualSenseClient-linux.zip

      - name: Write SHA256 checksums
        shell: pwsh
        run: |
          foreach ($f in @("DualSenseClient.zip", "DualSenseClient-linux.zip")) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $f" | Out-File -FilePath "$f.sha256" -Encoding ascii -NoNewline
          }
          $h = (Get-FileHash .\publish\appimage\DualSenseClient.AppImage -Algorithm SHA256).Hash.ToLower()
          "$h  DualSenseClient.AppImage" | Out-File -FilePath "DualSenseClient.AppImage.sha256" -Encoding ascii -NoNewline

      - name: Get latest release info
        id: latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $headers = @{
            "Accept" = "application/vnd.github+json"
            "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $latestTag = ""
          try {
            if ("${{ inputs.is_stable }}" -eq "true") {
              $response = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest" -Headers $headers -ErrorAction Stop
              $latestTag = $response.tag_name
            } else {
              # Order-independent: pick the highest build number N from tags
              # matching v<version>-<N>.<sha7>. The releases API offers no
              # ordering guarantee, so `gh release list --limit 1` can return
              # a stale tag (e.g. v1.0.0-9 listed above v1.0.0-10).
              $tagVersion = "${{ steps.version.outputs.version }}"
              $prefix = "v$tagVersion-"
              $maxN = -1
              $latestTag = ""
              foreach ($t in (git tag --list "$prefix*")) {
                $m = [regex]::Match($t, "^" + [regex]::Escape($prefix) + "(\d+)\.[0-9a-f]{7}$")
                if ($m.Success -and [int]$m.Groups[1].Value -gt $maxN) {
                  $maxN = [int]$m.Groups[1].Value
                  $latestTag = $t
                }
              }
              if ([string]::IsNullOrEmpty($latestTag)) { throw "No previous nightly tag found for prefix $prefix" }
            }
          } catch {
            Write-Host "No previous release found: $($_.Exception.Message)"
          }

          if ([string]::IsNullOrEmpty($latestTag)) {
            $latestTag = "3938ccc513d096ced6bda250a806132a6d59ba2b"
            Write-Host "Using initial commit as changelog base"
          }

          "LATEST_RELEASE_TAG=$latestTag" >> $env:GITHUB_ENV
          "LATEST_RELEASE_FOUND=true" >> $env:GITHUB_ENV
          $LASTEXITCODE = 0

      - name: Generate changelog
        shell: pwsh
        continue-on-error: true
        run: |
          $lastCommitSha = ""
          if ("${{ env.LATEST_RELEASE_FOUND }}" -eq "true") {
            $lastCommitSha = git rev-list -n 1 "${{ env.LATEST_RELEASE_TAG }}" 2>$null
          }
          python ./scripts/generate_changelog.py $lastCommitSha --debug 2>> changelog_debug.txt || true

      - name: Get release metadata
        id: info
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          $shortSha = $sha.Substring(0, 7)
          $branch = "${{ github.ref_name }}"

          "sha_short=$shortSha" >> $env:GITHUB_OUTPUT
          "branch=$branch" >> $env:GITHUB_OUTPUT

      - name: Create pre-release
        id: create_prerelease
        if: "!inputs.is_stable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $branch = "${{ steps.info.outputs.branch }}"
          $shaShort = "${{ steps.info.outputs.sha_short }}"
          $compareBase = git rev-list -n 1 "${{ env.LATEST_RELEASE_TAG }}" 2>$null
          if ([string]::IsNullOrEmpty($compareBase)) { $compareBase = "${{ env.LATEST_RELEASE_TAG }}" } else { $compareBase = $compareBase.Substring(0, 7) }
          $compareUrl = "${{ github.server_url }}/${{ github.repository }}/compare/$compareBase...$shaShort"

          $notes = @"
          This is an automated pre-release build containing the latest changes from the $branch branch.

          ⚠️  Warning: This is a development build and may contain bugs or incomplete features.
          📋 See all changes since the last release: $compareUrl

          📝 Commit: $shaShort
          🌿 Branch: $branch
          "@

          $changelog = $env:CHANGELOG
          if (-not [string]::IsNullOrEmpty($changelog)) {
            $notes += "`n`n$changelog"
          }

          $versionPrefix = "v$version-"
          $maxN = 0
          foreach ($t in (git tag --list "$versionPrefix*")) {
            $m = [regex]::Match($t, "^" + [regex]::Escape($versionPrefix) + "(\d+)\.([0-9a-f]{7})$")
            if ($m.Success) {
              $n = [int]$m.Groups[1].Value
              if ($n -gt $maxN) { $maxN = $n }
            }
          }
          $tag = "$versionPrefix$($maxN + 1).$shaShort"

          Write-Host "Creating pre-release $tag ..."
          gh release create $tag DualSenseClient.zip DualSenseClient-linux.zip .\publish\appimage\DualSenseClient.AppImage DualSenseClient.zip.sha256 DualSenseClient-linux.zip.sha256 DualSenseClient.AppImage.sha256 --prerelease --title "DualSenseClient ($tag)" --notes "$notes" --target $branch

      - name: Create stable release
        id: create_stable
        if: "inputs.is_stable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $branch = "${{ steps.info.outputs.branch }}"
          $tag = "v$version"

          $changelog = $env:CHANGELOG
          $notesArgs = if ([string]::IsNullOrEmpty($changelog)) { @("--generate-notes") } else { @("--notes", $changelog) }

          Write-Host "Creating stable draft release..."
          gh release create $tag DualSenseClient.zip DualSenseClient-linux.zip .\publish\appimage\DualSenseClient.AppImage DualSenseClient.zip.sha256 DualSenseClient-linux.zip.sha256 DualSenseClient.AppImage.sha256 --draft @notesArgs --title "DualSenseClient ($tag)" --target $branch
          Write-Host "Stable draft release created! Go to GitHub to publish it."

      - name: Trigger changelog data update
        if: steps.create_prerelease.outcome == 'success' || steps.create_stable.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update_changelog.yml --repo "${{ github.repository }}"
